# Simple workflow for deploying specific files to GitHub Pages
name: Deploy specific content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]
    # Only trigger when specific files or directories are modified
    paths:
      - 'nejm_outputs/**'
      - 'results/**'
      - '10cases.py'
      - 'nejm_poc_raw_outputs.csv'
      - 'task2data.jsonl'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare files for deployment
        run: |
          # Create a temporary directory for deployment
          mkdir -p dist
          # Copy specific directories and files to dist/
          cp -r nejm_outputs dist/ 2>/dev/null || true
          cp -r results dist/ 2>/dev/null || true
          cp 10cases.py dist/ 2>/dev/null || true
          cp nejm_poc_raw_outputs.csv dist/ 2>/dev/null || true
          cp task2data.jsonl dist/ 2>/dev/null || true
          cp index.html dist/ 2>/dev/null || true

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload only the dist/ directory
          path: 'dist/'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
